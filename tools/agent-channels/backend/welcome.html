<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>启程 · AI 工作空间</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;--paper:#eff4f5;--muted:#a5b6be;--line:rgba(185,222,226,.18);--mint:#a8eedc;--coral:#f2a994}
*{box-sizing:border-box}
html{min-height:100%}
body{min-width:320px;min-height:100vh;margin:0;color:var(--paper);overflow-x:hidden;background:radial-gradient(ellipse 55% 85% at 80% 45%,rgba(38,91,107,.23),transparent 75%),linear-gradient(135deg,#0d1c28 0%,#09111d 54%,#0b1520 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:linear-gradient(rgba(146,196,204,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(146,196,204,.10) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(90deg,transparent 6%,black 45%,black 100%)}
.shell{position:relative;width:min(100% - 104px,1480px);min-height:100vh;margin:auto;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:94px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:39px;height:39px;display:grid;place-items:center;border:1px solid rgba(168,238,220,.65);border-radius:11px;color:var(--mint);font-size:23px;font-weight:700;transform:rotate(-8deg)}
.brand-mark span{transform:rotate(8deg)}
.brand-name{font-size:18px;font-weight:700;letter-spacing:.14em}
.brand-sub{color:#8298a5;font-size:10px;letter-spacing:.2em;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:26px}
.topbar-context{color:#91a6ae;font-size:12px;letter-spacing:.12em}
.channel-label{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid rgba(168,238,220,.33);border-radius:999px;background:rgba(168,238,220,.06);color:#caeee3;font-size:12px;letter-spacing:.07em}
.channel-label:before{content:"";width:7px;height:7px;border:1px solid var(--mint);border-radius:50%}
.hero{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,350px);align-items:center;gap:clamp(24px,5vw,90px);padding:34px 0}
.intro{position:relative;z-index:2;padding-bottom:8px}
.eyebrow{display:flex;align-items:center;gap:14px;color:var(--mint);font-size:12px;letter-spacing:.2em;font-weight:700}
.eyebrow:before{content:"";display:block;width:26px;height:1px;background:var(--mint)}
h1{margin:24px 0 21px;font-size:clamp(44px,4.5vw,72px);font-weight:650;letter-spacing:-.065em;line-height:1.17}
h1 em{display:block;color:var(--mint);font-style:normal}
.lead{max-width:580px;margin:0;color:#b9c8ce;font-size:clamp(15px,1.14vw,18px);line-height:1.78}
.start-cue{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-top:36px;color:#b9c8ce;font-size:14px;line-height:1.5}
.keys{display:inline-flex;align-items:center;gap:6px;color:var(--mint);white-space:nowrap}
kbd{display:inline-grid;place-items:center;min-width:31px;height:30px;padding:0 7px;border:1px solid rgba(168,238,220,.45);border-bottom-width:2px;border-radius:6px;background:rgba(168,238,220,.07);font:600 12px/1 "Microsoft YaHei UI",sans-serif}
.visual{position:relative;min-height:330px;align-self:center;width:100%;display:grid;place-items:center;overflow:hidden}
.visual:before{content:"";position:absolute;width:min(360px,100%);aspect-ratio:1;border:1px solid rgba(168,238,220,.12);border-radius:50%;transform:translate(5%,1%) rotate(-24deg) scaleX(.9);box-shadow:0 0 0 36px rgba(168,238,220,.025),0 0 0 72px rgba(168,238,220,.018)}
.visual:after{content:"";position:absolute;width:42%;height:1px;top:14%;right:-5%;background:linear-gradient(90deg,transparent,rgba(168,238,220,.45),transparent);transform:rotate(-31deg)}
.visual-core{position:relative;width:min(100%,340px);aspect-ratio:1.12}
.corner{position:absolute;width:36px;height:36px;border-color:rgba(168,238,220,.5);border-style:solid}
.corner.tl{top:10%;left:8%;border-width:1px 0 0 1px}
.corner.tr{top:10%;right:8%;border-width:1px 1px 0 0}
.corner.bl{bottom:10%;left:8%;border-width:0 0 1px 1px}
.corner.br{bottom:10%;right:8%;border-width:0 1px 1px 0}
.arc{position:absolute;inset:13% 11%;width:78%;height:74%;overflow:visible}
.arc circle,.arc path{fill:none;stroke:rgba(149,217,211,.4);stroke-width:1}
.arc circle:nth-child(2){stroke:rgba(149,217,211,.14);stroke-dasharray:2 8}
.arc .bright{stroke:var(--mint);stroke-width:2.5;stroke-linecap:round}
.arc .warm{stroke:var(--coral);stroke-width:2;stroke-linecap:round}
.arc .point{fill:var(--mint);stroke:none}
.arc .point-warm{fill:var(--coral);stroke:none}
.visual-number{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);font:300 100px/1 Georgia,serif;letter-spacing:-.09em;color:#e7f5f0;text-shadow:0 0 56px rgba(168,238,220,.16)}
.visual-caption{position:absolute;left:50%;top:65%;transform:translateX(-50%);white-space:nowrap;color:#a8c4c5;font-size:11px;letter-spacing:.25em}
.visual-index{position:absolute;top:13%;left:14%;color:var(--mint);font:700 11px/1.4 monospace;letter-spacing:.15em}
.guidance{display:flex;align-items:center;flex-wrap:wrap;gap:10px 28px;min-height:67px;padding:17px 0;border-top:1px solid var(--line);color:#afc3c7;font-size:13px;line-height:1.5}
.guidance strong{color:var(--paper);font-weight:600}
.guidance .separator{width:1px;height:17px;background:var(--line)}
.footer{display:flex;justify-content:space-between;gap:20px;padding:15px 0 20px;border-top:1px solid var(--line);color:#748d96;font-size:11px;letter-spacing:.04em}
@media(max-width:1100px){.shell{width:min(100% - 64px,1480px)}.hero{grid-template-columns:minmax(0,1fr) 280px;gap:14px}h1{font-size:clamp(43px,5vw,58px)}}
@media(max-width:760px){.shell{width:min(100% - 38px,620px)}.topbar{min-height:72px}.topbar-context{display:none}.brand-mark{width:34px;height:34px}.hero{display:block;padding:52px 0 58px}h1{margin-top:23px;font-size:clamp(42px,8vw,60px)}.lead{font-size:16px}.visual{display:none}.guidance{gap:10px 18px}.footer{display:block;line-height:1.6}.footer span+span{display:block;margin-top:4px}}
@media(max-height:850px) and (min-width:761px){.topbar{min-height:72px}.hero{padding:16px 0}.visual{min-height:290px}.visual-core{max-width:290px}h1{margin:17px 0}.start-cue{margin-top:26px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true"><span>启</span></div><div><div class="brand-name">启程</div><div class="brand-sub">QICHENG WORKSPACE</div></div></div>
    <div class="topbar-right"><span class="topbar-context">独立浏览环境 / LINUX</span><span class="channel-label" id="channel-label">AI 频道 1</span></div>
  </header>
  <main class="hero">
    <section class="intro" aria-labelledby="title">
      <div class="eyebrow">你的 AI 工作空间</div>
      <h1 id="title">一间空间，<em>专注一件事。</em></h1>
      <p class="lead">在独立频道里浏览、收集和处理资料。需要亲自操作时，从查看器接管；完成后，再把输入权交给 AI。</p>
      <div class="start-cue"><span class="keys"><kbd>Ctrl</kbd> + <kbd>L</kbd></span><span>接管后，在浏览器顶部地址栏打开网站</span></div>
    </section>
    <div class="visual" aria-hidden="true">
      <div class="visual-core">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <svg class="arc" viewBox="0 0 400 400" focusable="false">
          <circle cx="200" cy="200" r="155"/><circle cx="200" cy="200" r="122"/>
          <path class="bright" d="M 66 122 A 155 155 0 0 1 288 73"/>
          <path class="warm" d="M 326 290 A 155 155 0 0 1 240 350"/>
          <path d="M 45 200 H 103 M 297 200 H 355 M 200 45 V 103 M 200 297 V 355"/>
          <circle class="point" cx="66" cy="122" r="5"/><circle class="point-warm" cx="326" cy="290" r="4"/>
        </svg>
        <span class="visual-index">CHANNEL / <span id="visual-index">01</span></span>
        <span class="visual-number" id="visual-number">01</span>
        <span class="visual-caption">SPACE FOR FOCUSED WORK</span>
      </div>
    </div>
  </main>
  <section class="guidance" aria-label="控制提示">
    <span><strong>你操作</strong> · 查看器中选“我来接管”</span>
    <span class="separator" aria-hidden="true"></span>
    <span><strong>AI 操作</strong> · 查看器中选“交给 AI”</span>
    <span class="separator" aria-hidden="true"></span>
    <span>控制状态以查看器为准</span>
  </section>
  <footer class="footer"><span>浏览资料与下载内容保存在当前频道。</span><span>ALT + 1 返回本机</span></footer>
</div>
<script>
const channel=location.hash==="#2"?"2":"1";
document.getElementById("channel-label").textContent="AI 频道 "+channel;
document.getElementById("visual-index").textContent="0"+channel;
document.getElementById("visual-number").textContent="0"+channel;
</script>
</body>
</html>
